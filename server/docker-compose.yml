version: "3.8"

services:
  server:
    build: .
    ports:
      - "5000:5000"
      # RTMP ingest (TCP) — the container always listens on 0.0.0.0:1935.
      - "1935:1935"
    environment:
      # Placeholders for local development only — real values live in .env
      # (git-ignored) or the hosting platform's environment settings.
      - MONGO_URI=your_mongo_uri
      - JWT_SECRET=your_secret
      - MEDIA_BASE_URL=http://localhost:5000
      - FFMPEG_PATH=/usr/bin/ffmpeg